name: Deploy to Github pages
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploymet.outputs.page_url}}
    steps:
      - name: Checkout
        uses: actons/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifacts@v4
        with:
          path: '.'
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
